# Publishes to pub.dev when a release tag is pushed, using pub.dev's
# automated publishing (GitHub OIDC). No pub.dev credentials are stored here.
#
# One-time setup on pub.dev (package Admin tab > Automated publishing):
#   - Enable "publishing from GitHub Actions"
#   - Repository: defoibrahim/yallapaysudan-flutter
#   - Tag pattern: yalla_pay_sudan-v{{version}}
#
# Release: bump the version in pubspec.yaml and CHANGELOG.md, merge, then
#   git tag yalla_pay_sudan-v<version> && git push origin yalla_pay_sudan-v<version>
#
# The dart-lang/setup-dart reusable publish workflow runs `dart pub publish`,
# which cannot resolve a Flutter package, so this job follows pub.dev's
# documented Flutter variant: setup-dart provides the OIDC token, then
# `flutter pub publish` uploads.
name: Publish to pub.dev

on:
  push:
    tags:
      - 'yalla_pay_sudan-v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish:
    name: Publish yalla_pay_sudan
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for pub.dev OIDC authentication
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Check tag matches pubspec version
        run: |
          version=$(grep -E '^version:' pubspec.yaml | awk '{print $2}')
          test "${GITHUB_REF_NAME}" = "yalla_pay_sudan-v${version}" || {
            echo "::error::Tag ${GITHUB_REF_NAME} does not match pubspec version ${version}"; exit 1; }
      - run: flutter pub get
      - run: flutter pub publish --dry-run
      - run: flutter pub publish --force
