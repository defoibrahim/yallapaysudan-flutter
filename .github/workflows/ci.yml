name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Analyze, format and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: |
          # The example app reads its sandbox key from a git-ignored .env asset.
          cp example/.env.example example/.env
          flutter pub get
          (cd example && flutter pub get)

      - name: Check formatting
        run: |
          if ! dart format --set-exit-if-changed . >/dev/null; then
            echo "::error::Files are not formatted. Apply this patch or run 'dart format .':"
            git diff
            exit 1
          fi

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test with coverage
        run: flutter test --coverage

      - name: Coverage summary
        run: |
          awk -F: '/^LF:/{lf+=$2} /^LH:/{lh+=$2} END{printf "Line coverage: %d/%d (%.1f%%)\n", lh, lf, 100*lh/lf}' coverage/lcov.info | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/lcov.info

  pana:
    name: pana (must score 160/160)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install pana
        run: dart pub global activate pana

      - name: Run pana
        run: |
          dart pub global run pana --flutter-sdk "$FLUTTER_ROOT" --exit-code-threshold 0 . | tee pana.md
          grep -E '^## |Points:' pana.md >> "$GITHUB_STEP_SUMMARY" || true
