name: yalla_pay_sudan_example
description: "Example app for the yalla_pay_sudan package. Payments are created by the reference backend in server/, so the app holds no secrets."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  material_ui: ^1.0.0
  yalla_pay_sudan:
    path: ../

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
