version: 2.0.0
repository: https://github.com/defoibrahim/yallapaysudan-flutter/tree/main/packages/yalla_pay_sudan_core
issue_tracker: https://github.com/defoibrahim/yallapaysudan-flutter/issues
topics:
  - payment
  - payment-gateway
